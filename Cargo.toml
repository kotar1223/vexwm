[package]
name = "vexwm"
version = "0.1.0"
edition = "2021"
description = "A lightweight, configurable Wayland compositor"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/vexwm"

[dependencies]
anyhow = "1"
kdl = "6"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
